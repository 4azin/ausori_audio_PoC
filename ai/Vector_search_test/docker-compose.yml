services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vector-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vector_search_test
    ports:
      - "5433:5432"
    volumes:
      - vector_search_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vector_search_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vector_search_postgres_data:
